<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barter & Trade SA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo-container">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
            <h1>TradeMarket SA</h1>
        </div>
        <div class="header-actions">
            <button id="btn-gps-toggle" class="location-chip">📍 Near Me</button>
            <div id="auth-status" class="auth-status"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="app-main">

        <!-- TAB 1: Explore Screen -->
        <section id="explore-tab" class="tab-content active">
            <div class="filter-card">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search items, locations..." />
                </div>
                <div class="filter-grid">
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="clothing">Clothing</option>
                        <option value="electronics">Electronics</option>
                        <option value="general">General</option>
                    </select>
                    <select id="distance-filter">
                        <option value="all">Any Distance</option>
                        <option value="5">Within 5 km</option>
                        <option value="15">Within 15 km</option>
                        <option value="50">Within 50 km</option>
                    </select>
                </div>
            </div>

            <div id="items-grid" class="item-grid">
                <!-- Dynamically rendered item cards -->
            </div>
        </section>

        <!-- TAB 2: Post Item Form -->
        <section id="post-tab" class="tab-content">
            <div class="form-card">
                <h2>List an Item for Trade</h2>
                <form id="post-item-form">
                    <div class="form-group">
                        <label for="item-title">Item Title *</label>
                        <input type="text" id="item-title" required placeholder="e.g. Vintage Leather Jacket">
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label for="item-category">Category *</label>
                            <select id="item-category" required>
                                <option value="clothing">Clothing</option>
                                <option value="electronics">Electronics</option>
                                <option value="general" selected>General</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="item-price">Valuation (R) *</label>
                            <input type="number" id="item-price" min="0" step="10" placeholder="e.g. 450" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="item-location">Location Name *</label>
                        <input type="text" id="item-location" required placeholder="e.g. Rosebank, Johannesburg">
                    </div>

                    <div class="form-group">
                        <label for="item-image">Upload Photo</label>
                        <input type="file" id="item-image" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label for="item-desc">Description *</label>
                        <textarea id="item-desc" rows="3" required placeholder="Describe condition, details, etc."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="item-wanted">What do you want in return?</label>
                        <input type="text" id="item-wanted" placeholder="e.g. Looking for boots size 8 or mechanical keyboard">
                    </div>

                    <button type="submit" class="submit-btn">Publish Trade Listing</button>
                </form>
            </div>
        </section>

        <!-- TAB 3: Trades & Offers Manager -->
        <section id="trades-tab" class="tab-content">
            <h2 style="margin-bottom: 1rem;">Active Offers & Counter-Offers</h2>
            <div id="offers-list" class="offers-container">
                <!-- Dynamically rendered offer cards -->
            </div>
        </section>

        <!-- TAB 4: Profile / Account Settings -->
        <section id="profile-tab" class="tab-content">
            <div class="form-card">
                <h2>Manage Account</h2>
                <div id="profile-details-container">
                    <!-- Account info rendered here -->
                </div>
            </div>
        </section>

    </main>

    <!-- Modal: Make / Counter Offer -->
    <div id="offer-modal" class="modal-overlay">
        <div class="modal-card">
            <button class="close-modal-btn" onclick="closeModal('offer-modal')">&times;</button>
            <h3 id="offer-modal-title">Make an Offer</h3>
            <form id="offer-form" style="margin-top: 1rem;">
                <input type="hidden" id="offer-target-item-id">
                <div class="form-group">
                    <label>Your Item to Trade (Optional)</label>
                    <select id="offer-my-item">
                        <option value="">-- Select an item from your listings --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Add Cash Top-Up (Rands)</label>
                    <input type="number" id="offer-cash-topup" min="0" placeholder="e.g. 150">
                </div>
                <div class="form-group">
                    <label>Message to Trader</label>
                    <textarea id="offer-message" rows="3" placeholder="Propose your terms or ask a question..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit Offer</button>
            </form>
        </div>
    </div>

    <!-- Modal: Live Chat -->
    <div id="chat-modal" class="modal-overlay">
        <div class="modal-card chat-modal-card">
            <button class="close-modal-btn" onclick="closeModal('chat-modal')">&times;</button>
            <div class="chat-header">
                <h3 id="chat-target-name">Chat</h3>
                <span id="chat-item-title" class="chat-subtitle">Item Trade Discussion</span>
            </div>
            <div id="chat-messages" class="chat-messages-container"></div>
            <form id="chat-form" class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Type a message..." required autocomplete="off">
                <button type="submit" class="chat-send-btn">&#10148;</button>
            </form>
        </div>
    </div>

    <!-- Modal: Meetup Setup -->
    <div id="meetup-modal" class="modal-overlay">
        <div class="modal-card">
            <button class="close-modal-btn" onclick="closeModal('meetup-modal')">&times;</button>
            <h3>Schedule Meetup & Exchange</h3>
            <p class="subtitle">Select a safe zone and time for the physical trade.</p>
            <form id="meetup-form" style="margin-top: 1rem;">
                <input type="hidden" id="meetup-offer-id">
                <div class="form-group">
                    <label>Exchange Location / Safe Zone</label>
                    <input type="text" id="meetup-location" required placeholder="e.g. Police Station / Malls Safe Exchange Zone">
                </div>
                <div class="form-group">
                    <label>Date & Time</label>
                    <input type="datetime-local" id="meetup-datetime" required>
                </div>
                <div class="form-group">
                    <label>Additional Notes</label>
                    <textarea id="meetup-notes" rows="2" placeholder="e.g. Let's meet near the main entrance coffee shop."></textarea>
                </div>
                <button type="submit" class="submit-btn">Confirm Meetup</button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button type="button" class="bottom-nav-btn active" data-tab="explore-tab">
            <span>Explore</span>
        </button>
        <button type="button" class="bottom-nav-btn" data-tab="post-tab">
            <span>List Item</span>
        </button>
        <button type="button" class="bottom-nav-btn" data-tab="trades-tab">
            <span class="nav-badge-wrapper">
                Trades
                <span id="trades-badge" class="badge-count" style="display:none;">0</span>
            </span>
        </button>
        <button type="button" class="bottom-nav-btn" data-tab="profile-tab">
            <span>Account</span>
        </button>
    </nav>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
