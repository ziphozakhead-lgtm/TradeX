<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barter & Trade Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--primary-color);
        }

        .auth-status button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-status button:hover {
            background-color: var(--primary-hover);
        }

        /* Container & Tabs */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Controls / Search Bar */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .controls input, .controls select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .controls input {
            flex: 1;
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #eee;
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            text-transform: capitalize;
        }

        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .card-price {
            color: var(--primary-color);
            font-weight: bold;
        }

        .card-location {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 13px;
            color: #444;
            margin-bottom: 12px;
            flex: 1;
        }

        .card-wanted {
            background: #f0f7f0;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 10px;
        }

        .btn-trade {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Post Form */
        .form-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .form-card h2 {
            margin-bottom: 16px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .bottom-nav-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            padding: 10px 20px;
        }

        .bottom-nav-btn.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>TradeMarket</h1>
        <div id="auth-status" class="auth-status">
            <!-- Dynamically populated by JS -->
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- TAB 1: Explore Screen -->
        <div id="explore-tab" class="tab-content active">
            <div class="controls">
                <input type="text" id="search-input" placeholder="Search items, locations..." />
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="clothing">Clothing</option>
                    <option value="electronics">Electronics</option>
                    <option value="general">General</option>
                </select>
            </div>

            <div id="items-grid" class="items-grid">
                <!-- Dynamically rendered item cards -->
            </div>
        </div>

        <!-- TAB 2: Post Item Form -->
        <div id="post-tab" class="tab-content">
            <div class="form-card">
                <h2>List an Item for Trade</h2>
                <form id="post-item-form">
                    <div class="form-group">
                        <label for="item-title">Item Title *</label>
                        <input type="text" id="item-title" required placeholder="e.g. Vintage Camera">
                    </div>

                    <div class="form-group">
                        <label for="item-category">Category *</label>
                        <select id="item-category" required>
                            <option value="clothing">Clothing</option>
                            <option value="electronics">Electronics</option>
                            <option value="general" selected>General</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="item-price">Estimated Value ($)</label>
                        <input type="number" id="item-price" min="0" step="1" placeholder="0">
                    </div>

                    <div class="form-group">
                        <label for="item-location">Location *</label>
                        <input type="text" id="item-location" required placeholder="e.g. Downtown Market">
                    </div>

                    <div class="form-group">
                        <label for="item-image">Upload Photo</label>
                        <input type="file" id="item-image" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label for="item-desc">Description *</label>
                        <textarea id="item-desc" rows="3" required placeholder="Describe condition, details, etc."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="item-wanted">What do you want in return?</label>
                        <input type="text" id="item-wanted" placeholder="e.g. Looking for books or Bluetooth speaker">
                    </div>

                    <button type="submit" class="btn-submit">Publish Trade Listing</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button type="button" class="bottom-nav-btn active" data-tab="explore-tab">Explore</button>
        <button type="button" class="bottom-nav-btn" data-tab="post-tab">List Item</button>
    </nav>

    <!-- Script File Linking -->
    <script src="app.js"></script>
</body>
</html>
